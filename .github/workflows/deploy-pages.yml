name: GŁOS Notes PWA · deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: glos-pwa-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify PWA and offline assets
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Upload static site for alternative hosting
        uses: actions/upload-artifact@v4
        with:
          name: glos-notes-pwa-static-site
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload offline-ready website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
