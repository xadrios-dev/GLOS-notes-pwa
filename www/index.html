<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
  <meta name="theme-color" content="#f7f8f5"><meta name="color-scheme" content="light">
  <meta name="description" content="GŁOS Notes: nagrywaj, transkrybuj lokalnie i rozmawiaj ze swoimi notatkami.">
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="dark.css"><link rel="stylesheet" href="design-system.css"><title>GŁOS Notes</title>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0m-7 7v4m-4 0h8"/></symbol>
    <symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6M16 14v6"/></symbol>
    <symbol id="inbox" viewBox="0 0 24 24"><path d="M4 4h16l2 13v3H2v-3L4 4zM2 14h6l2 3h4l2-3h6"/></symbol>
    <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="12" rx="2"/><path d="M16 9V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 18v3h16v-3"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M5 7h14M9 4h6M7 7l1 14h8l1-14M10 11v6m4-6v6"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></symbol>
    <symbol id="play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol>
    <symbol id="stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
    <symbol id="spark" viewBox="0 0 24 24"><path d="m12 2 2.3 7.7L22 12l-7.7 2.3L12 22l-2.3-7.7L2 12l7.7-2.3z"/></symbol>
    <symbol id="file" viewBox="0 0 24 24"><path d="M6 2h9l4 4v16H6zM15 2v5h4M9 12h7M9 16h7"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v10H3zM9 21v-7h6v7"/></symbol>
    <symbol id="send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2.5-7.5zM10.5 13.5 21 3"/></symbol>
    <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4zM17 9a5 5 0 0 1 0 6M20 6a9 9 0 0 1 0 12"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="M5 5 19 19M19 5 5 19"/></symbol>
  </svg>
  <div id="app" class="app">
    <header class="app-header" id="app-header">
      <div class="brand"><span class="brand-emblem"><svg><use href="#mic"/></svg></span><span class="brand-name">GŁOS<span class="brand-dot">.</span></span></div>
      <button type="button" class="icon-button" data-action="settings" aria-label="Ustawienia"><svg><use href="#settings"/></svg></button>
    </header>
    <main id="screen" class="screen" aria-live="polite"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Nawigacja">
      <button type="button" class="nav-item active" data-action="home"><svg><use href="#home"/></svg><span>Notatki</span></button>
      <button type="button" class="nav-item" data-action="inbox"><svg><use href="#inbox"/></svg><span>Odebrane</span></button>
      <button type="button" class="record-fab" data-action="start" aria-label="Nagraj notatkę"><svg><use href="#mic"/></svg></button>
      <button type="button" class="nav-item" data-action="tasks"><svg><use href="#check"/></svg><span>Zadania</span></button>
      <button type="button" class="nav-item" data-action="library"><svg><use href="#spark"/></svg><span>Biblioteka AI</span></button>
    </nav>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/mp4,audio/ogg,audio/flac,.mp3,.wav,.m4a,.ogg,.opus,.flac" hidden>
    <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif" multiple hidden>
  </div>
  <script src="vendor/markdown-it.min.js" defer></script>
  <script src="vendor/purify.min.js" defer></script>
  <script src="vendor/turndown.min.js" defer></script>
  <script src="sync-journal.js" defer></script>
  <script src="platform.js" defer></script>
  <script src="library-search.js" defer></script>
  <script src="semantic-search.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
